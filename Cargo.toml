[package]
name = "git-switch"
version = "1.0.13"
edition = "2024"
categories = ["command-line-utilities", "development-tools"]
description = "Interactive Git branch switcher with merged-branch cleanup"
keywords = ["branch", "cli", "git"]
license = "MIT"
# The lib target exists for `main.rs` and the integration tests, not as a
# contract for anyone else — `git-switch` ships as a binary, from a release
# tarball or `just install`. Saying so here keeps a `pub fn` from reading as
# published API, and makes an accidental `cargo publish` fail rather than
# create one.
publish = false
readme = "README.md"
repository = "https://github.com/brzzdev/git-switch"

[dependencies]
console = "0.16"
crossterm = "0.29"
ctrlc = "3"
indicatif = "0.18"
thiserror = "2"

[dev-dependencies]
portable-pty = "0.9"
tempfile = "3"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
